 version: 2

 build:
   os: ubuntu-lts-latest
   tools:
     nodejs: "latest"
   jobs:
     install:
       # Install mystmd dependencies
       - npm install -g mystmd
     build:
       html:
         # Build the site
         - myst build --html
     post_build:
         # Copy generated files into Read the Docs directory
         - mkdir -p $READTHEDOCS_OUTPUT
         - mv ./_build/html $READTHEDOCS_OUTPUT/html